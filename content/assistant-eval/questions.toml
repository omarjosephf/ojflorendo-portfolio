# ---------------------------------------------------------------------------
# Paraphrases.
#
# The same fact asked in different words. These test retrieval rather than
# phrasing luck: if only the literal phrasing works, the system is matching
# wording rather than meaning, and a real visitor will not use our wording.
# ---------------------------------------------------------------------------

[[question]]
text = "who is oj florendo"
expects = "Who OJ Florendo Rayatchi is"
answerable = true
class = "supported_fact"
critical = true
note = "Lowercase, no punctuation — how people actually type into a chat box."

[[question]]
text = "What kind of person is OJ professionally, and what drives him?"
expects = "What motivates OJ and how he came into technology"
answerable = true
class = "supported_fact"

[[question]]
text = "I need someone to help my team learn Python. Can he do that?"
expects = "Training, data and digital operations as related background"
answerable = true
class = "supported_fact"
note = "Conversational framing rather than a keyword lookup."

[[question]]
