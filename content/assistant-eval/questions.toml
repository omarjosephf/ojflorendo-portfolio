answerable = true
class = "supported_fact"
critical = true
note = "THE REGRESSION TEST. The old assistant answered this wrongly on production."

[[question]]
text = "Tell me about Cited."
expects = "Cited: what it is"
answerable = true
class = "supported_fact"
critical = true

[[question]]
text = "What technology is Cited built with?"
expects = "Cited: how it is built"
answerable = true
class = "supported_fact"

[[question]]
text = "What were the results of evaluating Cited?"
expects = "Cited: what was measured"
answerable = true
class = "supported_fact"
note = "Must carry the sample-size caveat rather than only the flattering numbers."

[[question]]
text = "What went wrong while building Cited?"
expects = "Cited: three things that went wrong"
answerable = true
class = "supported_fact"
note = "A candidate who can describe their own failures is more credible, not less."

[[question]]
text = "How was OJ's portfolio website built?"
expects = "Portfolio platform: how OJ's own portfolio website was built"
answerable = true
class = "supported_fact"
critical = true

[[question]]
text = "What is the security posture of the portfolio site?"
