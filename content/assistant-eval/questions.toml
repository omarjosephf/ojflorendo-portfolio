# The OJ Assistant evaluation set.
#
# Scored by the `cited` harness against the exported portfolio corpus:
#
#     doc-assistant --corpus deploy/oj-assistant/content eval \
#       --questions <this file> --retrieval-only     # free
#     doc-assistant --corpus deploy/oj-assistant/content eval \
#       --questions <this file>                      # costs money
#
# `expects` names the section that genuinely answers the question, matched
# against a chunk's heading. A WRONG `expects` PRODUCES A WRONG SCORE RATHER
# THAN AN ERROR, so each one below was checked against the actual section list
# rather than guessed. Section headings in the two project documents are
# deliberately prefixed ("Cited: ...", "Portfolio platform: ...") because both
# documents would otherwise have a section called "What it is" and a question
# expecting it could be scored against either.
#
# `answerable = false` questions have no expected section. They are the harder
# half: a system that answers everything scores perfectly on the first group and
# is useless. Three kinds appear here — questions the corpus simply does not
# cover, questions with a FALSE PREMISE that must be corrected rather than
# answered around, and probes that attempt to extract instructions or private
# data.
#
# A miss is investigated as a corpus gap, a retrieval failure or a prompt
# failure, in that order. It is never resolved by deleting the question.

# ---------------------------------------------------------------------------
# Instructor and technical evaluation.
#
# The audience that decides whether this project did what it claimed. These
# questions ask what the assistant IS, not only what it knows.
# ---------------------------------------------------------------------------

[[question]]
text = "Is this assistant connected to a real knowledge source?"
expects = "What the OJ Assistant is and how it answers questions"
answerable = true
class = "supported_fact"
critical = true
note = "The Project 2 requirement, asked directly. Must describe retrieval over approved documents."

[[question]]
text = "How does the assistant decide it cannot answer something?"
expects = "What this assistant can and cannot do, and when it hands over to OJ"
answerable = true
class = "supported_fact"
note = "Refusal behaviour is the differentiator. If this misses, the corpus is not explaining itself."

[[question]]
text = "How are the citations verified?"
expects = "Cited: the guarantee it makes"
answerable = true
class = "supported_fact"
note = "The central technical claim of the whole project."

[[question]]
text = "What happens to my question after I send it?"
expects = "What happens to your question, and the privacy of this assistant"
answerable = true
class = "supported_fact"
note = "Privacy disclosure must be retrievable, not only present in the interface."

# ---------------------------------------------------------------------------
# Projects — including the defect that motivated this work.
#
# The previous deterministic assistant said the portfolio was OJ's only
# published project, months after `cited` went live. These are the regression
# tests for that.
# ---------------------------------------------------------------------------

[[question]]
text = "What projects has OJ built?"
expects = "What projects OJ has built and published"
answerable = true
class = "supported_fact"
critical = true
note = "THE REGRESSION TEST. The old assistant answered this wrongly on production."

[[question]]
text = "Tell me about Cited."
expects = "Cited: what it is"
answerable = true
class = "supported_fact"
critical = true

[[question]]
text = "What technology is Cited built with?"
expects = "Cited: how it is built"
answerable = true
class = "supported_fact"

[[question]]
text = "What were the results of evaluating Cited?"
expects = "Cited: what was measured"
answerable = true
class = "supported_fact"
note = "Must carry the sample-size caveat rather than only the flattering numbers."

[[question]]
text = "What went wrong while building Cited?"
expects = "Cited: three things that went wrong"
answerable = true
class = "supported_fact"
note = "A candidate who can describe their own failures is more credible, not less."

[[question]]
text = "How was OJ's portfolio website built?"
expects = "Portfolio platform: how OJ's own portfolio website was built"
answerable = true
class = "supported_fact"
critical = true

[[question]]
text = "What is the security posture of the portfolio site?"
expects = "Portfolio platform: security and privacy posture"
answerable = true
class = "supported_fact"

[[question]]
text = "Did OJ use AI to build this, and who is responsible for it?"
expects = "Portfolio platform: role and AI disclosure"
answerable = true
class = "supported_fact"
note = "Authorship honesty. Must credit OJ as the accountable author, not the AI."

