version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      # Keep noisy patch/minor bumps together.
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    # Two major upgrades are deliberately deferred (2026-08-02). Both were
    # attempted, both broke the gate, and both are blocked on upstream support
    # rather than on anything in this repository. Minor and patch updates still
    # flow normally, so security fixes are not blocked.
    ignore:
      # TypeScript 7.0 disables ESLint: typescript-eslint 8.65.0 declares
      # `typescript: ">=4.8.4 <6.1.0"` and refuses to load. `tsc --noEmit` still
      # passes under 7.0, so the breakage is invisible to typechecking alone.
      # The project runs 6.0.3, the newest release inside the supported range.
      # Revisit when typescript-eslint supports TS >= 7.1 (their issue #10940).
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # ESLint 10 removes `context.getFilename()`, which the eslint-plugin-react
      # bundled inside eslint-config-next still calls, so linting crashes. Not
      # fixable here: that plugin arrives transitively with the pinned Next
      # version. Revisit when eslint-config-next ships an ESLint 10 compatible
      # eslint-plugin-react.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      # React 19.3 is held back by @react-three/fiber, not by anything here.
      # r3f declares `react: ">=19 <19.3"`, so `npm ci` fails at resolution
      # before a single test runs (PR #82, run 35233724689). 9.7.0 is the
      # newest r3f release and still caps at <19.3, so no upgrade closes this
      # today. r3f renders the hero particle wave (ADR-0002, ADR-0008,
      # ADR-0009), so accepting a forced resolution would put the landing
      # page's headline effect on an arrangement upstream says is unsupported.
      # Patch updates inside 19.2.x still flow, so security fixes are not
      # blocked. Revisit when @react-three/fiber widens its react peer range.
      - dependency-name: "react"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"
      - dependency-name: "react-dom"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"
      # The type packages describe the runtime, so they move with it. Letting
      # them reach 19.3 while React stays on 19.2 would typecheck the app
      # against APIs that are not there at runtime.
      - dependency-name: "@types/react"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"
      - dependency-name: "@types/react-dom"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
